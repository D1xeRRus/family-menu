<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка связи</title><style>body{font:17px system-ui;margin:24px;max-width:700px}button{font:inherit;padding:14px;background:#21664f;color:white;border:0;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:14px;border-radius:10px}</style><h1>Проверка связи с каталогом</h1><p>Проверка не меняет настройки и цены.</p><button id="go">Запустить проверку</button><pre id="out">Нажмите кнопку.</pre><script>
const base='https://family-menu-prices.semenovdmi05.workers.dev/';
const out=document.getElementById('out');
document.getElementById('go').onclick=async function(){this.disabled=true;out.textContent='Источник страницы: '+location.origin+'\n';const log=s=>out.textContent+=s+'\n';for(const [name,query,mode] of [['Короткий каталог','?city=moscow&store=pyaterochka','cors'],['Полный каталог','?city=moscow&store=pyaterochka&all=1','cors'],['Проверка сети без CORS','?city=moscow&store=pyaterochka','no-cors']]){log('\n'+name+'…');const t=Date.now();const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),25000);try{const r=await fetch(base+query,{mode,signal:ctl.signal});log('HTTP: '+r.status+'; тип: '+r.type+'; '+(Date.now()-t)+' мс');if(mode==='cors'){const data=await r.json();log('success: '+data.success+'; товаров: '+data.totalProducts+'; получено: '+(data.products?.length??0));}}catch(e){log(e.name+': '+e.message+'; '+(Date.now()-t)+' мс');}finally{clearTimeout(timer);}}this.disabled=false;};
</script></html>
