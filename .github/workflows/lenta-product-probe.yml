
name: Lenta product check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check product 181019
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error

          url = 'https://mcp.lenta.com/mcp'
          version = '2025-03-26'
          session = None

          def rpc(method, params, rid=None):
              global session

              msg = dict(
                  jsonrpc='2.0',
                  method=method,
                  params=params
              )

              if rid is not None:
                  msg['id'] = rid

              headers = {
                  'Content-Type':'application/json',
                  'Accept':'application/json, text/event-stream',
                  'MCP-Protocol-Version':version
              }

              if session:
                  headers['Mcp-Session-Id'] = session

              req = urllib.request.Request(
                  url,
                  json.dumps(msg).encode(),
                  headers
              )

              try:
                  with urllib.request.urlopen(
                      req, timeout=25
                  ) as r:

                      session = (
                          r.headers.get('Mcp-Session-Id')
                          or session
                      )

                      if rid is None:
                          return None

                      if 'text/event-stream' in r.headers.get(
                          'Content-Type',''
                      ):
                          for line in r:
                              if line.startswith(b'data:'):
                                  value = json.loads(line[5:])
                                  if value.get('id') == rid:
                                      break
                          else:
                              raise RuntimeError(
                                  'No matching SSE response'
                              )
                      else:
                          value = json.load(r)

              except urllib.error.HTTPError as e:
                  raise RuntimeError(
                      f'HTTP {e.code}: '
                      + e.read(1000).decode(errors='replace')
                  ) from e

              if 'error' in value:
                  raise RuntimeError(str(value['error']))

              return value['result']

          def call(name, arguments, rid):
              result = rpc(
                  'tools/call',
                  {
                      'name':name,
                      'arguments':arguments
                  },
                  rid
              )

              print(
                  name,
                  json.dumps(
                      result,
                      ensure_ascii=False
                  )[:18000],
                  flush=True
              )

              return result

          init = rpc(
              'initialize',
              {
                  'protocolVersion':version,
                  'capabilities':{},
                  'clientInfo':{
                      'name':'family-menu-check',
                      'version':'1.1'
                  }
              },
              1
          )

          version = init['protocolVersion']
          rpc('notifications/initialized', {})

          tools = {
              t['name']:t
              for t in rpc('tools/list', {}, 2)['tools']
          }

          print('MCP connected:', version, flush=True)

          for name in (
              'storefront_resolve_store',
              'storefront_products_search',
              'storefront_product_details'
          ):
              if name in tools:
                  print(
                      'SCHEMA', name,
                      json.dumps(
                          tools[name]['inputSchema'],
                          ensure_ascii=False
                      ),
                      flush=True
                  )

          addresses = [
              'Москва, улица Поречная, дом 10',
              'Московская область, Серпухов, деревня Борисово, дом 111А'
          ]

          for i, address in enumerate(addresses):

              print('\n===', address, '===', flush=True)

              print(
                  'CHANNEL: locc (pickup diagnostic; NOT retail confirmed)',
                  flush=True
              )

              try:
                  schema = tools[
                      'storefront_resolve_store'
                  ]['inputSchema']

                  props = schema.get('properties', {})

                  args = {
                      'address':address,
                      'retailBrand':'lo',
                      'channel':'locc'
                  }

                  call(
                      'storefront_resolve_store',
                      {
                          k:v for k,v in args.items()
                          if k in props
                      },
                      10+i*10
                  )

              except Exception as e:
                  print(
                      'STORE RESOLVE ERROR',
                      str(e),
                      flush=True
                  )

              try:
                  call(
                      'storefront_products_search',
                      {
                          'address':address,
                          'retailBrand':'lo',
                          'channel':'locc',
                          'query':'Картофель красный весовой',
                          'page':1
                      },
                      11+i*10
                  )

              except Exception as e:
                  print(
                      'SEARCH ERROR',
                      str(e),
                      flush=True
                  )

          print(
              'CONTROL: SKU 181019; Moscow screenshot: '
              '69.99 RUB/kg card, 73.69 second price, '
              '99 kg stock',
              flush=True
          )

          print(
              'No prices imported. '
              'Pickup is not a confirmed shelf-price source.',
              flush=True
          )
          PY
