<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка связи</title><style>body{font:17px system-ui;margin:24px;max-width:700px}button{font:inherit;padding:14px;background:#21664f;color:white;border:0;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:14px;border-radius:10px}</style><h1>Проверка связи с каталогом</h1><p>Проверка не меняет настройки и цены.</p><button id="go">Запустить проверку</button><pre id="out">Нажмите кнопку.</pre><script>
const base='https://family-menu-prices.semenovdmi05.workers.dev/';
const out=document.getElementById('out');
document.getElementById('go').onclick=async function(){this.disabled=true;out.textContent='Проверка страниц каталога\n';const log=s=>out.textContent+=s+'\n';let snapshot,total=0,expected=0;try{for(let page=1;page<=15;page++){const u=new URL(base);u.searchParams.set('city','moscow');u.searchParams.set('store','pyaterochka');u.searchParams.set('page',page);if(snapshot)u.searchParams.set('snapshot',snapshot);const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),25000);try{const r=await fetch(u,{signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.workerVersion!=='4.3'||d.page!==page||!d.snapshot||!d.success||!Array.isArray(d.products)||!d.products.length)throw Error('Неверный ответ страницы');if(snapshot&&snapshot!==d.snapshot)throw Error('Каталог изменился');snapshot=d.snapshot;expected=d.totalProducts;total+=d.products.length;log('Страница '+page+': '+d.products.length+' товаров; всего '+total+' из '+expected);log('Кеш: '+d.cacheStatus);if(page>=d.totalPages)break;}finally{clearTimeout(timer);}}if(total!==expected)throw Error('Неполный каталог');log('Успех: '+total+' товаров получено порциями.');}catch(e){log('Ошибка: '+e.message);}finally{this.disabled=false;}};
</script></html>
